# 单机 broker 配置（仅开发用）。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

namesrvAddr = rocketmq-namesrv:9876

# 关键：broker 把自己的地址注册到 namesrv，客户端拿到后直连。
# 不配的话注册的是容器内网 IP（如 172.x.x.x），宿主机上的服务连不上。
# 配成 127.0.0.1 后宿主机客户端经端口映射连通；容器内的 proxy 走本机回环也通。
brokerIP1 = 127.0.0.1

# 开发期允许客户端首次发送时自动建 topic，省去手工 mqadmin updateTopic。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
