# 普通 integration IT 的隔离默认值；生产配置仍在 src/main/resources/application.yml。
rocketmq.producer.group=codemind-integration-producer-test
codemind.mq.topic.pull-request-received=codemind-pull-request-received-test
codemind.mq.topic.review-completed=codemind-review-completed-test
codemind.mq.topic.review-published=codemind-review-published-test
codemind.mq.topic.finding-feedback=codemind-finding-feedback-test
codemind.feedback.poll-enabled=false
codemind.mq.consumer-group.pull-request-received=codemind-integration-pr-received-test
codemind.mq.consumer-group.review-completed=codemind-integration-review-completed-test
codemind.mq.consumer-group.review-published=codemind-integration-review-published-test
codemind.publication.dispatch-enabled=false
codemind.recovery.enabled=false
# S6 评审 I-4（Task 9）：同review模块的理由，压每个测试上下文的连接池上限，
# 避免全仓 *IT 通配符时多个缓存上下文叠加耗尽 PG max_connections。
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
