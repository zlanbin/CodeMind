server:
  port: 8081

spring:
  application:
    name: codemind-integration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  # integration 启动同样需要 PostgreSQL；与 review 共用实例，但迁移历史和业务表独立。
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:codemind}
    username: ${POSTGRES_USER:codemind}
    password: ${POSTGRES_PASSWORD:codemind}
  flyway:
    enabled: true
    default-schema: integration
    schemas: integration
    locations: classpath:db/integration-migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: codemind-integration-producer
    send-message-timeout: 3000

codemind:
  webhook:
    # 密钥只从环境变量注入，不写入仓库
    github-secret: ${GITHUB_WEBHOOK_SECRET}
    # Redis 幂等键 TTL（ISO-8601 Duration），过期后由 review_task 唯一索引兜底
    idempotency-ttl: P7D
  mq:
    topic:
      pull-request-received: codemind-pull-request-received
      review-completed: codemind-review-completed
      review-published: codemind-review-published
      finding-feedback: codemind-finding-feedback
    consumer-group:
      review-completed: codemind-integration-review-completed
  feedback:
    # M9：轮询已发布 review 的 👎 / 回复。只读 GitHub；测试里关掉
    poll-enabled: ${CODEMIND_FEEDBACK_POLL_ENABLED:true}
    poll-interval: ${CODEMIND_FEEDBACK_POLL_INTERVAL:5m}
    poll-initial-delay: 1m
    # 只看最近这段时间发布（或更新）过的 review
    lookback: ${CODEMIND_FEEDBACK_LOOKBACK:14d}
  scm:
    # 访问令牌只从环境变量注入，不写入仓库。空串为匿名（只能读公开仓库，限流很低）
    github-token: ${GITHUB_TOKEN:}
    github-api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    request-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
