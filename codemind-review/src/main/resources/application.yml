server:
  port: 8082

spring:
  application:
    name: codemind-review
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:codemind}
    username: ${POSTGRES_USER:codemind}
    password: ${POSTGRES_PASSWORD:codemind}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    openai:
      # OpenAI 兼容协议，M4 走中转端点（模型为 Claude 系列）。API Key 只经环境变量注入，不写入仓库。
      # 占位默认值仅为让无 Key 环境（如纯 checkpoint IT）也能加载上下文——Spring AI 对空 key 会在启动期报错；
      # 真实 LLM 调用（ReviewAgentIT）按环境变量 CODEMIND_LLM_API_KEY 是否存在决定是否执行。
      base-url: ${CODEMIND_LLM_BASE_URL:https://api.aiblitz.io}
      api-key: ${CODEMIND_LLM_API_KEY:placeholder-no-key}
      chat:
        options:
          model: ${CODEMIND_LLM_MODEL:claude-haiku-4-5-20251001}
          temperature: 0.0

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: codemind-review-producer
    send-message-timeout: 3000

codemind:
  mq:
    topic:
      pull-request-received: codemind-pull-request-received
    consumer-group:
      pull-request-received: codemind-review-pr-received
  llm:
    max-retries: ${CODEMIND_LLM_MAX_RETRIES:2}
  dag:
    # 单节点超时。子会话要等真实 LLM，给足
    node-timeout: ${CODEMIND_DAG_NODE_TIMEOUT:120s}
    node-retries: ${CODEMIND_DAG_NODE_RETRIES:1}
    # 单片 diff 的 token 上限；0 表示用默认（总预算 128k × 30%）
    diff-budget: ${CODEMIND_DIFF_BUDGET:0}
  recovery:
    # 默认关：开着会让所有 IT 的上下文里多一个定时任务扫库。真实运行与演示必须设为 true
    enabled: ${CODEMIND_RECOVERY_ENABLED:false}
    # 空闲多久算卡死。REVIEWING 阶段几十个 LLM 调用期间任务状态不变，阈值要给足
    idle-threshold: ${CODEMIND_RECOVERY_IDLE_THRESHOLD:15m}
    scan-interval: ${CODEMIND_RECOVERY_SCAN_INTERVAL:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
