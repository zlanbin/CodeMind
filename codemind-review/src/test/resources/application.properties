# 普通 review IT 的隔离默认值；生产配置仍在 src/main/resources/application.yml。
rocketmq.producer.group=codemind-review-producer-test
codemind.mq.topic.pull-request-received=codemind-pull-request-received-test
codemind.mq.topic.review-completed=codemind-review-completed-test
codemind.mq.topic.review-published=codemind-review-published-test
codemind.mq.consumer-group.pull-request-received=codemind-review-pr-received-test
codemind.mq.consumer-group.review-completed=codemind-review-review-completed-test
codemind.mq.consumer-group.review-published=codemind-review-review-published-test
codemind.publication.dispatch-enabled=false
codemind.recovery.enabled=false
# S6 评审 I-4：全仓跑 *IT 通配符时，每个未加 @DirtiesContext 隔离的 @SpringBootTest 上下文
# 都会被缓存并各自持有一个 HikariCP 池；池默认上限 10，十几个上下文叠起来就把 PG 的
# max_connections=100 耗尽（FATAL: sorry, too many clients already）。压到每池 2 条，
# 测试场景没有真实并发压力，2 条足够跑完所有用例。
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
